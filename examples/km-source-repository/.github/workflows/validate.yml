name: Validate KM Repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLING_REPOSITORY: {{TOOLING_REPOSITORY}}
  TOOLING_REF: {{TOOLING_REF}}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: km-repo
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate current repository state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          tooling-repo/.venv/bin/dsw-km-validate-release
          --repo-root km-repo
          --github-repository "$GITHUB_REPOSITORY"
          --allow-unreleased

      - name: Prepare review artifact
        run: |
          artifact="$RUNNER_TEMP/{{ASSET_STEM}}"
          mkdir -p "$artifact"
          cp km-repo/km/{{KM_ID}}.km "$artifact/{{ASSET_STEM}}.km"
          cp km-repo/release-manifest.yml "$artifact/release-manifest.yml"
          (
            cd "$artifact"
            sha256sum {{ASSET_STEM}}.km > {{ASSET_STEM}}.km.sha256
          )

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: {{ASSET_STEM}}-${{ github.sha }}
          path: ${{ runner.temp }}/{{ASSET_STEM}}
          if-no-files-found: error
          retention-days: 14
