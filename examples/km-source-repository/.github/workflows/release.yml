name: Publish KM Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TOOLING_REPOSITORY: {{TOOLING_REPOSITORY}}
  TOOLING_REF: {{TOOLING_REF}}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: km-repo
          fetch-depth: 0

      - name: Verify tag is reachable from the default branch
        working-directory: km-repo
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          tagged_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tagged_commit" FETCH_HEAD; then
            echo "Refusing to release a tag that is not on $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate immutable release boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          tooling-repo/.venv/bin/dsw-km-validate-release
          --repo-root km-repo
          --tag "$GITHUB_REF_NAME"
          --github-repository "$GITHUB_REPOSITORY"

      - name: Prepare versioned assets
        working-directory: km-repo
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          cp "km/{{KM_ID}}.km" "$assets/{{ASSET_STEM}}-${version}.km"
          cp "km/{{KM_ID}}.km" "$assets/{{ASSET_STEM}}.km"
          cp "release-manifest.yml" "$assets/release-manifest.yml"
          (
            cd "$assets"
            sha256sum "{{ASSET_STEM}}-${version}.km" \
              > "{{ASSET_STEM}}-${version}.km.sha256"
            sha256sum "{{ASSET_STEM}}.km" \
              > "{{ASSET_STEM}}.km.sha256"
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$version" == 0.* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-assets/{{ASSET_STEM}}-${version}.km" \
            "$RUNNER_TEMP/release-assets/{{ASSET_STEM}}-${version}.km.sha256" \
            "$RUNNER_TEMP/release-assets/{{ASSET_STEM}}.km" \
            "$RUNNER_TEMP/release-assets/{{ASSET_STEM}}.km.sha256" \
            "$RUNNER_TEMP/release-assets/release-manifest.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
