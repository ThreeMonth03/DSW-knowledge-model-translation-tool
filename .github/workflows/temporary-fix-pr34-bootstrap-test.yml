name: temporary-fix-pr34-bootstrap-test

on:
  push:
    branches:
      - codex/fix-writable-pr-workflow-vulnerability

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: codex/fix-writable-pr-workflow-vulnerability
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Update bootstrap policy test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/infra/test_translation_repository_bootstrap.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert \'branches: ["translation/latest"]\' in workflow_text\n'
          new = (
              '    assert \'branches: ["translation/latest"]\' not in workflow_text\n'
              '    assert "pull_request:" not in workflow_text\n'
              '    assert "workflow_dispatch:" not in workflow_text\n'
          )
          if old not in text:
              raise SystemExit("stale bootstrap trigger assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          make install-dev BOOTSTRAP_PYTHON=python
          make format
          .venv/bin/python -m pytest \
            tests/infra/test_translation_repository_bootstrap.py \
            tests/infra/test_github_workflows.py
          git diff --check

          git rm -- .github/workflows/temporary-fix-pr34-bootstrap-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/infra/test_translation_repository_bootstrap.py
          git commit -m "test: align bootstrap with schedule-only writer"
          git push origin HEAD:codex/fix-writable-pr-workflow-vulnerability
