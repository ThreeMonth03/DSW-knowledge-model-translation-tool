name: temporary-rebuild-pr34

on:
  push:
    branches:
      - codex/fix-writable-pr-workflow-vulnerability

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rebuilt branch
        uses: actions/checkout@v5
        with:
          ref: codex/fix-writable-pr-workflow-vulnerability
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reapply and validate schedule-only writer policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git cherry-pick 40e0858f293bdaa978a6cce5cf4e575e2577391f; then
            git checkout --theirs -- \
              docs/security-and-permissions.md \
              examples/github-actions/localize_auto_sync_template.yml \
              examples/translation-repository/docs/security-and-permissions.md \
              tests/infra/test_github_workflows.py
            git add -- \
              docs/security-and-permissions.md \
              examples/github-actions/localize_auto_sync_template.yml \
              examples/translation-repository/docs/security-and-permissions.md \
              tests/infra/test_github_workflows.py
            GIT_EDITOR=true git cherry-pick --continue
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_required(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          template = Path("examples/github-actions/localize_auto_sync_template.yml")
          template_text = template.read_text(encoding="utf-8")
          template_text = template_text.replace("  workflow_dispatch:\n", "", 1)
          template.write_text(template_text, encoding="utf-8")

          replace_required(
              "docs/security-and-permissions.md",
              "trusted scheduled or manual runs",
              "trusted scheduled runs",
          )
          replace_required(
              "examples/translation-repository/docs/security-and-permissions.md",
              "trusted scheduled or manual runs",
              "trusted scheduled runs",
          )
          replace_required(
              "tests/infra/test_github_workflows.py",
              '    assert "pull_request" not in workflow["on"]\n'
              '    assert "workflow_dispatch" in workflow["on"]\n',
              '    assert "pull_request" not in workflow["on"]\n'
              '    assert "workflow_dispatch" not in workflow["on"]\n',
          )
          replace_required(
              "examples/translation-repository/docs/handoff-checklist.md",
              "| `localize_auto_sync.yml` | Scheduled, PR | Git |",
              "| `localize_auto_sync.yml` | Scheduled | Git |",
          )
          replace_required(
              "examples/translation-repository/docs/maintenance-runbook.md",
              "- A same-repository translation PR failed shared-block validation: inspect the\n"
              "  shared-sync step first. To reproduce it locally, run\n"
              "  `make repo-sync-shared-strings TRANSLATION_REPO_DIR=/path/to/repo`.\n"
              "- A fork translation PR failed shared-block validation: run the same command\n"
              "  locally and commit its `tree/` changes to the fork branch; Actions never\n"
              "  writes to forks.\n",
              "- A translation PR failed shared-block validation: run\n"
              "  `make repo-sync-shared-strings TRANSLATION_REPO_DIR=/path/to/repo` locally\n"
              "  and commit the resulting `tree/` changes to the PR branch. The scheduled\n"
              "  writer never executes PR-controlled code or writes to PR branches.\n",
          )
          PY

          make install-dev BOOTSTRAP_PYTHON=python
          make format
          python -m pytest tests/infra/test_github_workflows.py
          git diff --check

          git rm -- .github/workflows/temporary-rebuild-pr34.yml
          git add -- \
            docs/security-and-permissions.md \
            examples/github-actions/localize_auto_sync_template.yml \
            examples/translation-repository/docs/handoff-checklist.md \
            examples/translation-repository/docs/maintenance-runbook.md \
            examples/translation-repository/docs/security-and-permissions.md \
            tests/infra/test_github_workflows.py
          git commit -m "security: make Localize writer schedule-only"
          git push origin HEAD:codex/fix-writable-pr-workflow-vulnerability
