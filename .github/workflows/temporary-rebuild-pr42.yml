name: temporary-rebuild-pr42

on:
  push:
    branches:
      - codex/propose-fix-for-workflow-command-injection

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rebuilt branch
        uses: actions/checkout@v5
        with:
          ref: codex/propose-fix-for-workflow-command-injection
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply and validate shell-expansion hardening
        run: |
          set -euo pipefail
          python .github/temporary_rebuild_pr42.py
          make install-dev BOOTSTRAP_PYTHON=python
          make format
          .venv/bin/python -m pytest \
            tests/infra/test_translation_repository_config.py \
            tests/infra/test_github_workflows.py \
            tests/infra/test_translation_repository_bootstrap.py
          git diff --check

          git rm -- \
            .github/temporary_rebuild_pr42.py \
            .github/workflows/temporary-rebuild-pr42.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            examples/github-actions/github_translation_import_template.yml \
            examples/github-actions/km_version_auto_update_template.yml \
            examples/github-actions/localize_alignment_report_template.yml \
            examples/github-actions/localize_auto_sync_template.yml \
            examples/github-actions/localize_status_report_template.yml \
            tests/infra/test_github_workflows.py \
            tests/infra/test_translation_repository_config.py
          git commit -m "security: use quoted shell variables in workflows"
          git push origin HEAD:codex/propose-fix-for-workflow-command-injection
