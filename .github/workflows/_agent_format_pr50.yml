name: Format PR 50

on:
  push:
    branches:
      - codex/fix-legal-draft-timestamp-vulnerability-i4gcnk

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: codex/fix-legal-draft-timestamp-vulnerability-i4gcnk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Format and remove helper
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff format --config config/ruff.toml src tests
          rm -f .github/workflows/_agent_format_pr50.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format PR 50"
          git push origin HEAD:codex/fix-legal-draft-timestamp-vulnerability-i4gcnk
