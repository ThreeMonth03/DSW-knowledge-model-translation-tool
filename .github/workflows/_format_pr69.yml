name: Format PR 69

on:
  push:
    branches:
      - fix/retry-localize-transient-downloads

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/retry-localize-transient-downloads

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Format, remove helper, and push
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff format --config config/ruff.toml src tests
          rm -f .github/workflows/_format_pr69.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Localize retry support"
          git push origin HEAD:fix/retry-localize-transient-downloads
