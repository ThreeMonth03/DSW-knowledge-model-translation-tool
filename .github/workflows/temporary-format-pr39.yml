name: temporary-format-pr39

on:
  push:
    branches:
      - codex/fix-vulnerability-in-scaffolded-workflows

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: codex/fix-vulnerability-in-scaffolded-workflows
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply Ruff formatting and remove one-shot workflow
        run: |
          set -euo pipefail
          make install-dev BOOTSTRAP_PYTHON=python
          make format
          git diff --check
          git rm -- .github/workflows/temporary-format-pr39.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/dsw_km_translation_tool/translation_repository_config.py \
            tests/infra/test_translation_repository_config.py
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:codex/fix-vulnerability-in-scaffolded-workflows
