name: Harden PR 56

on:
  push:
    branches:
      - codex/fix-vulnerability-in-status-details-artifact

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: codex/fix-vulnerability-in-status-details-artifact

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Harden parent paths, format, and remove helper
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path

          source_path = Path("src/dsw_km_translation_tool/localize_status.py")
          source = source_path.read_text(encoding="utf-8")
          import_needle = "from .data_models import PoBlock\nfrom .po import PoCatalogParser\n"
          import_replacement = (
              "from .data_models import PoBlock\n"
              "from .path_safety import reject_symlink_path\n"
              "from .po import PoCatalogParser\n"
          )
          if import_needle not in source:
              raise SystemExit("localize_status import insertion point changed")
          source = source.replace(import_needle, import_replacement, 1)

          old_block = (
              "    path = Path(output_path)\n"
              "    path.parent.mkdir(parents=True, exist_ok=True)\n"
              "    flags = os.O_APPEND | os.O_CREAT | os.O_WRONLY\n"
              "    if hasattr(os, \"O_NOFOLLOW\"):\n"
              "        flags |= os.O_NOFOLLOW\n"
              "    elif path.is_symlink():\n"
              "        raise ValueError(f\"Refusing to write Markdown report through symlink: {path}\")\n"
              "    descriptor = os.open(path, flags, 0o666)\n"
          )
          new_block = (
              "    path = Path(output_path)\n"
              "    absolute_path = path if path.is_absolute() else Path.cwd() / path\n"
              "    filesystem_root = Path(absolute_path.anchor)\n"
              "    reject_symlink_path(absolute_path, root=filesystem_root)\n"
              "    absolute_path.parent.mkdir(parents=True, exist_ok=True)\n"
              "    reject_symlink_path(absolute_path, root=filesystem_root)\n"
              "    flags = os.O_APPEND | os.O_CREAT | os.O_WRONLY\n"
              "    if hasattr(os, \"O_NOFOLLOW\"):\n"
              "        flags |= os.O_NOFOLLOW\n"
              "    elif absolute_path.is_symlink():\n"
              "        raise ValueError(\n"
              "            f\"Refusing to write Markdown report through symlink: {absolute_path}\"\n"
              "        )\n"
              "    descriptor = os.open(absolute_path, flags, 0o666)\n"
          )
          if old_block not in source:
              raise SystemExit("localize_status output block changed")
          source_path.write_text(source.replace(old_block, new_block, 1), encoding="utf-8")

          test_path = Path("tests/infra/test_localize_status.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\n\ndef test_report_localize_status_cli_writes_outputs(\n"
          if marker not in tests:
              raise SystemExit("localize status test insertion point changed")
          parent_test = (
              "\n\n"
              "def test_localize_po_status_refuses_symlinked_markdown_parent(workspace: Path) -> None:\n"
              "    \"\"\"Verify Markdown output cannot escape through a symlinked parent directory.\"\"\"\n"
              "\n"
              "    po_path = workspace / \"latest.po\"\n"
              "    outside_path = workspace / \"outside\"\n"
              "    reports_path = workspace / \"reports\"\n"
              "    write_status_fixture_po(po_path)\n"
              "    outside_path.mkdir()\n"
              "    reports_path.symlink_to(outside_path, target_is_directory=True)\n"
              "\n"
              "    with pytest.raises(ValueError, match=\"symlinked artifact path\"):\n"
              "        write_localize_po_status_markdown(\n"
              "            build_localize_po_status_report(po_path), reports_path / \"details.md\"\n"
              "        )\n"
              "\n"
              "    assert not (outside_path / \"details.md\").exists()\n"
          )
          test_path.write_text(tests.replace(marker, parent_test + marker, 1), encoding="utf-8")
          PY
          .venv/bin/python -m ruff format --config config/ruff.toml src tests
          rm -f .github/workflows/_agent_harden_pr56.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: reject symlinked Markdown parent paths"
          git push origin HEAD:codex/fix-vulnerability-in-status-details-artifact
