name: Harden PR 56

on:
  push:
    branches:
      - codex/fix-vulnerability-in-status-details-artifact

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: codex/fix-vulnerability-in-status-details-artifact

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Harden parent paths, format, and remove helper
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path

          source_path = Path("src/dsw_km_translation_tool/localize_status.py")
          source = source_path.read_text(encoding="utf-8")
          import_needle = "from .data_models import PoBlock\nfrom .po import PoCatalogParser\n"
          import_replacement = (
              "from .data_models import PoBlock\n"
              "from .path_safety import reject_symlink_path\n"
              "from .po import PoCatalogParser\n"
          )
          if import_needle not in source:
              raise SystemExit("localize_status import insertion point changed")
          source = source.replace(import_needle, import_replacement, 1)

          old_block = '''    path = Path(output_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              flags = os.O_APPEND | os.O_CREAT | os.O_WRONLY
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              elif path.is_symlink():
                  raise ValueError(f"Refusing to write Markdown report through symlink: {path}")
              descriptor = os.open(path, flags, 0o666)
          '''
          old_block = "\n".join(line[4:] if line.startswith("    ") else line for line in old_block.splitlines()) + "\n"
          new_block = '''    path = Path(output_path)
              absolute_path = path if path.is_absolute() else Path.cwd() / path
              filesystem_root = Path(absolute_path.anchor)
              reject_symlink_path(absolute_path, root=filesystem_root)
              absolute_path.parent.mkdir(parents=True, exist_ok=True)
              reject_symlink_path(absolute_path, root=filesystem_root)
              flags = os.O_APPEND | os.O_CREAT | os.O_WRONLY
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              elif absolute_path.is_symlink():
                  raise ValueError(
                      f"Refusing to write Markdown report through symlink: {absolute_path}"
                  )
              descriptor = os.open(absolute_path, flags, 0o666)
          '''
          new_block = "\n".join(line[4:] if line.startswith("    ") else line for line in new_block.splitlines()) + "\n"
          if old_block not in source:
              raise SystemExit("localize_status output block changed")
          source_path.write_text(source.replace(old_block, new_block, 1), encoding="utf-8")

          test_path = Path("tests/infra/test_localize_status.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\n\ndef test_report_localize_status_cli_writes_outputs(\n"
          if marker not in tests:
              raise SystemExit("localize status test insertion point changed")
          parent_test = '''

          def test_localize_po_status_refuses_symlinked_markdown_parent(workspace: Path) -> None:
              """Verify Markdown output cannot escape through a symlinked parent directory."""

              po_path = workspace / "latest.po"
              outside_path = workspace / "outside"
              reports_path = workspace / "reports"
              write_status_fixture_po(po_path)
              outside_path.mkdir()
              reports_path.symlink_to(outside_path, target_is_directory=True)

              with pytest.raises(ValueError, match="symlinked artifact path"):
                  write_localize_po_status_markdown(
                      build_localize_po_status_report(po_path), reports_path / "details.md"
                  )

              assert not (outside_path / "details.md").exists()
          '''
          parent_test = "\n".join(line[10:] if line.startswith("          ") else line for line in parent_test.splitlines())
          test_path.write_text(tests.replace(marker, parent_test + marker, 1), encoding="utf-8")
          PY
          .venv/bin/python -m ruff format --config config/ruff.toml src tests
          rm -f .github/workflows/_agent_harden_pr56.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: reject symlinked Markdown parent paths"
          git push origin HEAD:codex/fix-vulnerability-in-status-details-artifact
