name: Harden PR 69 with repository fallback

on:
  push:
    branches:
      - fix/retry-localize-transient-downloads

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/retry-localize-transient-downloads

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply fallback and regressions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          localize_path = Path("src/dsw_km_translation_tool/localize_sync.py")
          localize = localize_path.read_text(encoding="utf-8")
          marker = "\n\ndef _download_url(\n"
          helper = '''

          def is_retryable_localize_download_error(error: BaseException) -> bool:
              """Return whether a Localize download failure is safe to retry or fall back from."""

              if isinstance(error, urllib.error.HTTPError):
                  return error.code in _RETRYABLE_HTTP_STATUS_CODES
              return isinstance(error, (urllib.error.URLError, TimeoutError))
          '''
          helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helper.splitlines()
          )
          if "def is_retryable_localize_download_error" not in localize:
              if marker not in localize:
                  raise SystemExit("localize downloader insertion point changed")
              localize = localize.replace(marker, helper + marker, 1)
          old_condition = (
              "            if error.code not in _RETRYABLE_HTTP_STATUS_CODES "
              "or attempt == max_attempts:\n"
          )
          new_condition = (
              "            if (\n"
              "                not is_retryable_localize_download_error(error)\n"
              "                or attempt == max_attempts\n"
              "            ):\n"
          )
          if old_condition in localize:
              localize = localize.replace(old_condition, new_condition, 1)
          elif "not is_retryable_localize_download_error(error)" not in localize:
              raise SystemExit("localize retry condition changed")
          localize_path.write_text(localize, encoding="utf-8")

          smoke_path = Path("src/dsw_km_translation_tool/upstream_smoke.py")
          smoke = smoke_path.read_text(encoding="utf-8")
          smoke = smoke.replace("import shutil\n", "import shutil\nimport urllib.error\n", 1)
          smoke = smoke.replace(
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom urllib.parse import quote, urlsplit\n",
              1,
          )
          old_imports = (
              "from .localize_sync import Downloader as LocalizeDownloader\n"
              "from .localize_sync import pull_localize_po\n"
          )
          new_imports = (
              "from .localize_sync import Downloader as LocalizeDownloader\n"
              "from .localize_sync import (\n"
              "    LocalizePullResult,\n"
              "    _download_url,\n"
              "    is_retryable_localize_download_error,\n"
              "    pull_localize_po,\n"
              ")\n"
          )
          if old_imports in smoke:
              smoke = smoke.replace(old_imports, new_imports, 1)
          elif "is_retryable_localize_download_error" not in smoke:
              raise SystemExit("upstream smoke Localize imports changed")
          smoke = smoke.replace(
              "    load_translation_repository_config,\n    version_paths,\n",
              "    load_translation_repository_config,\n"
              "    require_localize_config,\n"
              "    version_paths,\n",
              1,
          )
          old_fields = (
              "    localize_po_path: str | None = None\n"
              "    final_po_path: str | None = None\n"
          )
          new_fields = (
              "    localize_po_path: str | None = None\n"
              "    localize_source: str | None = None\n"
              "    localize_fallback_reason: str | None = None\n"
              "    final_po_path: str | None = None\n"
          )
          if old_fields in smoke:
              smoke = smoke.replace(old_fields, new_fields, 1)
          elif "localize_fallback_reason" not in smoke:
              raise SystemExit("upstream smoke result fields changed")

          old_pull_block = '''    km_result = pull_km_bundle(
              config_path=config_path,
              repo_root=resolved_work_dir,
              token=registry_token,
              downloader=bundle_downloader,
              allow_existing_change=True,
          )
              localize_result = pull_localize_po(
              config_path=config_path,
              repo_root=resolved_work_dir,
              downloader=localize_downloader,
          )

              source_km_path = resolved_work_dir / paths.source_km_path
              latest_po_path = resolved_work_dir / paths.localize_latest_po_path
              tree_dir = resolved_work_dir / paths.translation_tree_dir
              final_po_path = resolved_work_dir / paths.final_po_path
              final_km_path = resolved_work_dir / paths.final_km_path
          '''
          old_pull_block = "\n".join(
              line[4:] if line.startswith("    ") else line
              for line in old_pull_block.splitlines()
          ) + "\n"
          new_pull_block = '''    source_km_path = resolved_work_dir / paths.source_km_path
              latest_po_path = resolved_work_dir / paths.localize_latest_po_path
              tree_dir = resolved_work_dir / paths.translation_tree_dir
              final_po_path = resolved_work_dir / paths.final_po_path
              final_km_path = resolved_work_dir / paths.final_km_path

              km_result = pull_km_bundle(
              config_path=config_path,
              repo_root=resolved_work_dir,
              token=registry_token,
              downloader=bundle_downloader,
              allow_existing_change=True,
          )
              (
              localize_result,
              localize_source,
              localize_fallback_reason,
          ) = _pull_localize_with_repository_fallback(
              config_path=config_path,
              repo_root=resolved_work_dir,
              config=updated_config,
              latest_po_path=latest_po_path,
              downloader=localize_downloader,
          )
          '''
          new_pull_block = "\n".join(
              line[4:] if line.startswith("    ") else line
              for line in new_pull_block.splitlines()
          ) + "\n"
          if old_pull_block in smoke:
              smoke = smoke.replace(old_pull_block, new_pull_block, 1)
          elif "_pull_localize_with_repository_fallback" not in smoke:
              raise SystemExit("upstream smoke pull block changed")

          old_return = (
              '        status="passed",\n'
              '        work_dir=str(resolved_work_dir),\n'
          )
          new_return = (
              '        status=(\n'
              '            "passed"\n'
              '            if localize_source == "weblate"\n'
              '            else "passed:repository-fallback"\n'
              '        ),\n'
              '        work_dir=str(resolved_work_dir),\n'
          )
          if old_return in smoke:
              smoke = smoke.replace(old_return, new_return, 1)
          elif "passed:repository-fallback" not in smoke:
              raise SystemExit("upstream smoke return status changed")
          old_result_paths = (
              "        localize_po_path=str(latest_po_path),\n"
              "        final_po_path=str(final_po_path),\n"
          )
          new_result_paths = (
              "        localize_po_path=str(latest_po_path),\n"
              "        localize_source=localize_source,\n"
              "        localize_fallback_reason=localize_fallback_reason,\n"
              "        final_po_path=str(final_po_path),\n"
          )
          if old_result_paths in smoke:
              smoke = smoke.replace(old_result_paths, new_result_paths, 1)
          elif "localize_source=localize_source" not in smoke:
              raise SystemExit("upstream smoke result assignment changed")

          render_marker = "\n\ndef render_upstream_smoke_markdown(result: UpstreamSmokeResult) -> str:\n"
          helpers = '''

          def _pull_localize_with_repository_fallback(
              *,
              config_path: Path,
              repo_root: Path,
              config,
              latest_po_path: Path,
              downloader: LocalizeDownloader | None,
          ) -> tuple[LocalizePullResult, str, str | None]:
              """Pull live Weblate content or its configured GitHub mirror during maintenance."""

              try:
                  result = pull_localize_po(
                      config_path=config_path,
                      repo_root=repo_root,
                      downloader=downloader,
                  )
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as error:
                  if not is_retryable_localize_download_error(error):
                      raise
                  localize = require_localize_config(config)
                  fallback_url = _github_repository_po_url(
                      repository=localize.repository,
                      target_language=config.translation.target_language,
                  )
                  if fallback_url is None:
                      raise UpstreamSmokeError(
                          "Localize is temporarily unavailable and no supported GitHub "
                          "repository fallback is configured"
                      ) from error
                  download = downloader or _download_url
                  try:
                      payload = download(fallback_url)
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as fallback_error:
                      raise UpstreamSmokeError(
                          "Localize is temporarily unavailable and the configured GitHub "
                          f"repository fallback also failed: {fallback_error}"
                      ) from fallback_error
                  result = _write_localize_fallback_snapshot(
                      version=config.knowledge_model.version,
                      url=fallback_url,
                      latest_po_path=latest_po_path,
                      payload=payload,
                  )
                  return result, "github-repository", f"{type(error).__name__}: {error}"
              return result, "weblate", None


          def _github_repository_po_url(
              *,
              repository: str | None,
              target_language: str,
          ) -> str | None:
              """Derive the conventional PO snapshot URL for a configured GitHub mirror."""

              if not repository:
                  return None
              parsed = urlsplit(repository)
              if (
                  parsed.scheme != "https"
                  or (parsed.hostname or "").lower() != "github.com"
                  or parsed.username
                  or parsed.password
                  or parsed.query
                  or parsed.fragment
              ):
                  return None
              parts = [part for part in parsed.path.split("/") if part]
              if len(parts) != 2:
                  return None
              owner, repository_name = parts
              repository_name = repository_name.removesuffix(".git")
              if not owner or not repository_name:
                  return None
              return (
                  "https://raw.githubusercontent.com/"
                  f"{quote(owner, safe='')}/{quote(repository_name, safe='')}/main/"
                  f"locales/{quote(target_language, safe='')}/messages.po"
              )


          def _write_localize_fallback_snapshot(
              *,
              version: str,
              url: str,
              latest_po_path: Path,
              payload: bytes,
          ) -> LocalizePullResult:
              """Store a GitHub-mirrored PO using the normal Localize result contract."""

              previous = latest_po_path.read_bytes() if latest_po_path.exists() else None
              changed = previous != payload
              if changed:
                  latest_po_path.parent.mkdir(parents=True, exist_ok=True)
                  latest_po_path.write_bytes(payload)
              return LocalizePullResult(
                  version=version,
                  url=url,
                  latest_po_path=latest_po_path,
                  changed=changed,
                  initialized=previous is None,
                  bytes_downloaded=len(payload),
              )
          '''
          helpers = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helpers.splitlines()
          )
          if "def _pull_localize_with_repository_fallback" not in smoke:
              if render_marker not in smoke:
                  raise SystemExit("upstream smoke helper insertion point changed")
              smoke = smoke.replace(render_marker, helpers + render_marker, 1)

          old_markdown = (
              '        f"| Localize PO | {_format_value(result.localize_po_path)} |",\n'
              '        f"| Final PO | {_format_value(result.final_po_path)} |",\n'
          )
          new_markdown = (
              '        f"| Localize PO | {_format_value(result.localize_po_path)} |",\n'
              '        f"| Localize source | {_format_value(result.localize_source)} |",\n'
              '        f"| Localize fallback reason | "\n'
              '        f"{_format_value(result.localize_fallback_reason)} |",\n'
              '        f"| Final PO | {_format_value(result.final_po_path)} |",\n'
          )
          if old_markdown in smoke:
              smoke = smoke.replace(old_markdown, new_markdown, 1)
          elif "Localize fallback reason" not in smoke:
              raise SystemExit("upstream smoke Markdown rows changed")
          smoke_path.write_text(smoke, encoding="utf-8")

          test_path = Path("tests/infra/test_upstream_smoke.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace("import json\n", "import json\nimport urllib.error\n", 1)
          insertion = "\n\ndef test_upstream_smoke_reuses_matching_cached_km_bundle(\n"
          regression = '''

          def test_upstream_smoke_uses_github_mirror_during_localize_maintenance(
              workspace: Path,
              po_path: Path,
              model_path: Path,
          ) -> None:
              """Verify a transient Weblate outage falls back to its configured GitHub mirror."""

              config_template = workspace / "template.yml"
              work_dir = workspace / "upstream-smoke"
              write_config(config_template)
              primary_url = (
                  "https://localize.ds-wizard.org/download/knowledge-models/"
                  "common-dsw-knowledge-model/zh_Hant/"
              )
              fallback_url = (
                  "https://raw.githubusercontent.com/ds-wizard/dsw-root-locales/main/"
                  "locales/zh_Hant/messages.po"
              )
              requested_urls: list[str] = []

              def localize_downloader(url: str) -> bytes:
                  requested_urls.append(url)
                  if url == primary_url:
                      raise urllib.error.HTTPError(
                          url,
                          502,
                          "maintenance",
                          None,
                          None,
                      )
                  assert url == fallback_url
                  return po_path.read_bytes()

              result = run_upstream_smoke(
                  work_dir=work_dir,
                  config_template_path=config_template,
                  registry_token="secret",
                  registry_downloader=lambda _url: registry_payload("2.7.0"),
                  bundle_downloader=lambda _url, _token: model_path.read_bytes(),
                  localize_downloader=localize_downloader,
              )

              assert requested_urls == [primary_url, fallback_url]
              assert result.status == "passed:repository-fallback"
              assert result.localize_source == "github-repository"
              assert "HTTP Error 502" in (result.localize_fallback_reason or "")
              assert result.alignment_aligned is True
              assert (work_dir / "sources/localize/zh_Hant/latest.po").read_bytes() == po_path.read_bytes()
              report = render_upstream_smoke_markdown(result)
              assert "Status: **passed:repository-fallback**" in report
              assert "github-repository" in report
          '''
          regression = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in regression.splitlines()
          )
          if "test_upstream_smoke_uses_github_mirror_during_localize_maintenance" not in tests:
              if insertion not in tests:
                  raise SystemExit("upstream smoke test insertion point changed")
              tests = tests.replace(insertion, regression + insertion, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install development dependencies
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Format and verify focused regressions
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff check --fix --config config/ruff.toml src tests
          .venv/bin/python -m ruff format --config config/ruff.toml src tests
          .venv/bin/python -m pytest -q \
            tests/infra/test_localize_sync.py \
            tests/infra/test_upstream_smoke.py

      - name: Commit hardening and remove helper
        run: |
          set -euo pipefail
          rm -f .github/workflows/_harden_pr69_fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fall back to the Localize GitHub mirror during maintenance"
          git push origin HEAD:fix/retry-localize-transient-downloads
