name: Repair secure documentation links

on:
  push:
    branches:
      - fix/secure-repository-documentation-links

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/secure-repository-documentation-links
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Replace mutable owner-specific workflow links
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/examples/github-actions/github_translation_import_template.yml": "repo-file:examples/github-actions/github_translation_import_template.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/examples/github-actions/km_version_auto_update_template.yml": "repo-file:examples/github-actions/km_version_auto_update_template.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/examples/github-actions/localize_alignment_report_template.yml": "repo-file:examples/github-actions/localize_alignment_report_template.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/examples/github-actions/localize_auto_sync_template.yml": "repo-file:examples/github-actions/localize_auto_sync_template.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/examples/github-actions/localize_status_report_template.yml": "repo-file:examples/github-actions/localize_status_report_template.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/examples/github-actions/validate_translation_config_template.yml": "repo-file:examples/github-actions/validate_translation_config_template.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/examples/translation-config.yml": "repo-file:examples/translation-config.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/tests/infra/test_github_workflows.py": "repo-file:tests/infra/test_github_workflows.py",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/.github/workflows/unittest.yml": "repo-file:.github/workflows/unittest.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/blob/master/.github/workflows/upstream_smoke.yml": "repo-file:.github/workflows/upstream_smoke.yml",
              "https://github.com/ThreeMonth03/dsw-km-translation-tool/tree/master/examples/github-actions": "repo-tree:examples/github-actions",
          }
          docs = (
              Path("docs/architecture.md"),
              Path("docs/repository-transfer-checklist.md"),
              Path("docs/security-and-permissions.md"),
          )
          replaced = 0
          for path in docs:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  if old in text:
                      text = text.replace(old, new)
                      replaced += 1
              path.write_text(text, encoding="utf-8")
          if replaced != 18:
              raise SystemExit(f"Expected 18 security-sensitive link replacements, made {replaced}")

          conf_path = Path("docs/sphinx/conf.py")
          conf = conf_path.read_text(encoding="utf-8")
          if "import os\n" not in conf:
              conf = conf.replace(
                  "from __future__ import annotations\n\nimport sys\n",
                  "from __future__ import annotations\n\nimport os\nimport sys\n",
                  1,
              )
          marker = 'sys.path.insert(0, str(SRC_DIR))\n\nproject = "DSW KM Translation Tool"\n'
          repository_config = '''sys.path.insert(0, str(SRC_DIR))

GITHUB_REPOSITORY = os.environ.get(
    "GITHUB_REPOSITORY", "ThreeMonth03/dsw-km-translation-tool"
)
GITHUB_SOURCE_REF = (
    os.environ.get("GITHUB_SHA") or os.environ.get("GITHUB_REF_NAME") or "master"
)

project = "DSW KM Translation Tool"
'''
          if marker not in conf:
              raise SystemExit("Sphinx repository configuration insertion point changed")
          conf = conf.replace(marker, repository_config, 1)
          extension_marker = '''myst_enable_extensions = [
    "colon_fence",
]
'''
          scheme_config = '''myst_enable_extensions = [
    "colon_fence",
]
myst_url_schemes = {
    "http": None,
    "https": None,
    "ftp": None,
    "mailto": None,
    "repo-file": {
        "url": (
            f"https://github.com/{GITHUB_REPOSITORY}/blob/"
            f"{GITHUB_SOURCE_REF}/{{{{path}}}}"
        ),
        "classes": ["github"],
    },
    "repo-tree": {
        "url": (
            f"https://github.com/{GITHUB_REPOSITORY}/tree/"
            f"{GITHUB_SOURCE_REF}/{{{{path}}}}"
        ),
        "classes": ["github"],
    },
}
'''
          if extension_marker not in conf:
              raise SystemExit("Sphinx MyST configuration insertion point changed")
          conf_path.write_text(conf.replace(extension_marker, scheme_config, 1), encoding="utf-8")

          test_path = Path("tests/infra/test_documentation_links.py")
          test_path.write_text(
              '''"""Security coverage for repository-aware documentation links."""

from __future__ import annotations

import runpy
from pathlib import Path


SECURITY_LINKS = {
    "docs/architecture.md": {
        "github-import-template": "repo-file:examples/github-actions/github_translation_import_template.yml",
        "km-auto-update-template": "repo-file:examples/github-actions/km_version_auto_update_template.yml",
        "localize-alignment-template": "repo-file:examples/github-actions/localize_alignment_report_template.yml",
        "localize-auto-sync-template": "repo-file:examples/github-actions/localize_auto_sync_template.yml",
        "localize-status-template": "repo-file:examples/github-actions/localize_status_report_template.yml",
        "unittest-workflow": "repo-file:.github/workflows/unittest.yml",
        "upstream-smoke-workflow": "repo-file:.github/workflows/upstream_smoke.yml",
        "validate-config-template": "repo-file:examples/github-actions/validate_translation_config_template.yml",
    },
    "docs/repository-transfer-checklist.md": {
        "example-translation-config": "repo-file:examples/translation-config.yml",
        "github-actions-templates": "repo-tree:examples/github-actions",
        "test-github-workflows": "repo-file:tests/infra/test_github_workflows.py",
    },
    "docs/security-and-permissions.md": {
        "km-auto-update-template": "repo-file:examples/github-actions/km_version_auto_update_template.yml",
        "github-import-template": "repo-file:examples/github-actions/github_translation_import_template.yml",
        "github-actions-templates": "repo-tree:examples/github-actions",
        "localize-alignment-template": "repo-file:examples/github-actions/localize_alignment_report_template.yml",
        "localize-auto-sync-template": "repo-file:examples/github-actions/localize_auto_sync_template.yml",
        "localize-status-template": "repo-file:examples/github-actions/localize_status_report_template.yml",
        "upstream-smoke-workflow": "repo-file:.github/workflows/upstream_smoke.yml",
    },
}


def test_security_links_use_repository_aware_schemes(repo_root: Path) -> None:
    """Sensitive workflow links must not trust a mutable owner/default-branch URL."""

    for relative_path, links in SECURITY_LINKS.items():
        text = (repo_root / relative_path).read_text(encoding="utf-8")
        for label, destination in links.items():
            assert f"[{label}]: {destination}" in text


def test_sphinx_repository_schemes_follow_build_environment(
    repo_root: Path,
    monkeypatch,
) -> None:
    """Published links resolve against the repository and commit being built."""

    repository = "transferred-owner/transferred-repository"
    commit = "a" * 40
    monkeypatch.setenv("GITHUB_REPOSITORY", repository)
    monkeypatch.setenv("GITHUB_SHA", commit)

    config = runpy.run_path(str(repo_root / "docs/sphinx/conf.py"))
    schemes = config["myst_url_schemes"]

    assert schemes["repo-file"]["url"] == (
        f"https://github.com/{repository}/blob/{commit}/{{{{path}}}}"
    )
    assert schemes["repo-tree"]["url"] == (
        f"https://github.com/{repository}/tree/{commit}/{{{{path}}}}"
    )
''',
              encoding="utf-8",
          )
          PY

          .venv/bin/python -m ruff check --fix --config config/ruff.toml \
            docs/sphinx/conf.py tests/infra/test_documentation_links.py
          .venv/bin/python -m ruff format --config config/ruff.toml \
            docs/sphinx/conf.py tests/infra/test_documentation_links.py
          .venv/bin/python -m pytest -q tests/infra/test_documentation_links.py
          make docs

      - name: Commit repaired documentation
        run: |
          set -euo pipefail
          rm -f .github/workflows/_agent_fix_documentation_links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: resolve repository links from the audited build"
          git push origin HEAD:fix/secure-repository-documentation-links
